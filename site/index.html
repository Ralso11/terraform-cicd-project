<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terraform CI/CD Project</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      max-width: 560px;
      padding: 40px;
    }
    h1 { color: #38bdf8; }
    p { line-height: 1.6; color: #94a3b8; }
    code {
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>It works 🎉</h1>
    <p>
      This page is served from a private <code>S3 bucket</code> through
      <code>CloudFront</code>, deployed automatically by a
      <code>Terraform + GitHub Actions</code> CI/CD pipeline.
    </p>
    <p>No server was manually configured. No console clicking. Just code.</p>
  </div>
</body>
</html>
